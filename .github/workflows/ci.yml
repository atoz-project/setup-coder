name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: 测试与静态检查
    runs-on: arc-runner-set-rust # 弹性 pod;镜像自带 Rust 工具链与 build-essential(arc-runner-rust 仓)
    steps:
      - uses: actions/checkout@v4

      # 冷 pod 每次重新下载+编译 crates 依赖(~35s);GHA cache 后端对 self-hosted 可用,
      # ARC pod 临时性恰好规避非临时 runner 缓存膨胀问题
      - uses: Swatinem/rust-cache@v2

      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows:x86_64,迁 ARC 用 x86_64-pc-windows-gnu 交叉编译(ADR-0004;镜像 arc-runner-rust 自带 mingw 链接器与 gnu target)
          - { name: win-x64, os: arc-runner-set-rust, target: x86_64-pc-windows-gnu, bin: setup-coder.exe }
          # macOS arm64 / x86_64:均在 Apple Silicon runner 上构建(x86_64 走交叉编译,纯 Rust 无 C 依赖)
          - { name: mac-arm64, os: macos-latest, target: aarch64-apple-darwin, bin: setup-coder }
          - { name: mac-x64, os: macos-latest, target: x86_64-apple-darwin, bin: setup-coder }
          # Linux:x86_64 + musl 静态链接
          - { name: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-musl, bin: setup-coder }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # win-x64 在 ARC pod 上:镜像已钉 Rust 工具链并预装 gnu target,免 action 重复安装
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.name != 'win-x64'
        with:
          targets: ${{ matrix.target }}

      - name: 安装 musl 链接工具
        if: matrix.name == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: 编译
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: 收集产物
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" dist/

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: setup-coder-${{ matrix.name }}
          path: dist/${{ matrix.bin }}
          if-no-files-found: error

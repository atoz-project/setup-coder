name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: 测试与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test --locked
      - run: cargo clippy --locked -- -D warnings

  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows:x86_64 + 静态 CRT(+crt-static)
          - { name: win-x64, os: windows-latest, target: x86_64-pc-windows-msvc, bin: setup-coder.exe }
          # macOS arm64 / x86_64:均在 Apple Silicon runner 上构建(x86_64 走交叉编译,纯 Rust 无 C 依赖)
          - { name: mac-arm64, os: macos-latest, target: aarch64-apple-darwin, bin: setup-coder }
          - { name: mac-x64, os: macos-latest, target: x86_64-apple-darwin, bin: setup-coder }
          # Linux:x86_64 + musl 静态链接
          - { name: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-musl, bin: setup-coder }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装 musl 链接工具
        if: matrix.name == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: 编译(Windows 静态 CRT)
        if: matrix.name == 'win-x64'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: 编译
        if: matrix.name != 'win-x64'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: 收集产物
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" dist/

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: setup-coder-${{ matrix.name }}
          path: dist/${{ matrix.bin }}
          if-no-files-found: error
